name: CI

# Quality gate only — deployment is handled by Vercel's git integration.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run check

      # Not `npm run build` — that would re-run astro check, which the step above did.
      - name: Build
        run: npx astro build
